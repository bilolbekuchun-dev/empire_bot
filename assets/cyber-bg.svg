<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#123047"/>
      <stop offset="45%" stop-color="#081824"/>
      <stop offset="100%" stop-color="#050a0f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bdf3ff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#22c5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050a0f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050a0f" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1400" fill="url(#glow)"/>

  <!-- HUD radar rings, centered upper area -->
  <g transform="translate(450,340)" fill="none" stroke="#22c5ff">
    <circle r="90" opacity="0.28" stroke-width="1"/>
    <circle r="150" opacity="0.20" stroke-width="1"/>
    <circle r="220" opacity="0.14" stroke-width="1"/>
    <circle r="300" opacity="0.09" stroke-width="1"/>
    <circle r="90" opacity="0.5" stroke-width="2" stroke-dasharray="4 10"/>
    <circle r="220" opacity="0.35" stroke-width="1.5" stroke-dasharray="2 14"/>
    <line x1="-300" y1="0" x2="300" y2="0" opacity="0.10"/>
    <line x1="0" y1="-300" x2="0" y2="300" opacity="0.10"/>
  </g>
  <circle cx="450" cy="340" r="320" fill="url(#core)"/>

  <!-- crosshair ticks -->
  <g stroke="#8fe9ff" stroke-width="2" opacity="0.4">
    <line x1="450" y1="20" x2="450" y2="45"/>
    <line x1="450" y1="635" x2="450" y2="660"/>
    <line x1="130" y1="340" x2="155" y2="340"/>
    <line x1="745" y1="340" x2="770" y2="340"/>
  </g>

  <!-- scattered data nodes + connecting lines, network motif -->
  <g stroke="#22c5ff" stroke-width="1" opacity="0.28">
    <line x1="120" y1="180" x2="280" y2="260"/>
    <line x1="280" y1="260" x2="230" y2="420"/>
    <line x1="620" y1="220" x2="740" y2="160"/>
    <line x1="620" y1="220" x2="700" y2="380"/>
    <line x1="150" y1="520" x2="300" y2="560"/>
    <line x1="700" y1="500" x2="600" y2="600"/>
  </g>
  <g fill="#8fe9ff" opacity="0.6">
    <circle cx="120" cy="180" r="3"/>
    <circle cx="280" cy="260" r="2.5"/>
    <circle cx="230" cy="420" r="2.5"/>
    <circle cx="620" cy="220" r="3"/>
    <circle cx="740" cy="160" r="2.5"/>
    <circle cx="700" cy="380" r="2.5"/>
    <circle cx="150" cy="520" r="2.5"/>
    <circle cx="300" cy="560" r="2.5"/>
    <circle cx="700" cy="500" r="3"/>
    <circle cx="600" cy="600" r="2.5"/>
  </g>

  <!-- fine circuit-style grid lines, lower half -->
  <g stroke="#22c5ff" stroke-width="1" opacity="0.10">
    <path d="M0 780 H900"/>
    <path d="M0 900 H900"/>
    <path d="M0 1020 H900"/>
    <path d="M0 1140 H900"/>
    <path d="M100 780 V1400"/>
    <path d="M260 780 V1400"/>
    <path d="M430 780 V1400"/>
    <path d="M600 780 V1400"/>
    <path d="M780 780 V1400"/>
  </g>
  <g fill="#22c5ff" opacity="0.5">
    <circle cx="100" cy="900" r="2.5"/>
    <circle cx="430" cy="1020" r="2.5"/>
    <circle cx="600" cy="780" r="2.5"/>
    <circle cx="780" cy="1140" r="2.5"/>
    <circle cx="260" cy="1140" r="2.5"/>
  </g>

  <!-- floating hex/panel shapes, HUD widgets -->
  <g fill="none" stroke="#22c5ff" stroke-width="1.2" opacity="0.22">
    <rect x="60" y="60" width="150" height="90" rx="6"/>
    <rect x="690" y="80" width="150" height="90" rx="6"/>
    <rect x="60" y="640" width="120" height="70" rx="6"/>
    <rect x="720" y="620" width="120" height="70" rx="6"/>
  </g>

  <rect width="900" height="1400" fill="url(#fade)"/>
</svg>
